name: Windows verification
on:
  pull_request:
  push:
    branches: [strident.ai]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Verify with isolated app data
        run: python verify_app.py
      - name: Verify native console stays idle
        run: python verify_idle.py --output Strident_Idle_Result.json
